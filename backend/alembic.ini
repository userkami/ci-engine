[alembic]
# Path to migration scripts (relative to this file / the backend root).
script_location = alembic
# Allow `import app...` from the backend root during migration.
prepend_sys_path = .

# Overridden at runtime by alembic/env.py from the environment
# (DATABASE_URL via app.config.get_settings()). Kept here only as a
# fallback for offline SQL generation.
sqlalchemy.url = postgresql+asyncpg://ci_admin:replace_with_strong_password@postgres:5432/ci_database

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S